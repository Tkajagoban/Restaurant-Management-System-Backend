name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
 

jobs:

  build:
    runs-on: ubuntu-latest

  steps:
     - name: Checkout code
       uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring Boot app
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t kajagoban/restaurant-management-system:latest .

      - name: Push Docker image
        run: docker push kajagoban/restaurant-management-system:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull kajagoban/restaurant-management-system:latest
            docker rm -f restaurant-app || true
            docker run -d --name restaurant-app -p 8089:8089 --restart unless-stopped kajagoban/restaurant-management-system:latest
            docker ps
